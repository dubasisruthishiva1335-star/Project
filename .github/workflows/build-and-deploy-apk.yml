name: Build and Deploy MyVault APK to AWS S3

on:
  push:
    branches:
      - main
    paths:
      - 'mobile-app/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Split Release APKs & Deploy to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./mobile-app
        run: flutter pub get

      - name: Run Static Analysis
        working-directory: ./mobile-app
        run: flutter analyze

      - name: Build Split-Per-ABI Release APKs
        working-directory: ./mobile-app
        run: flutter build apk --release --split-per-abi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: 'eu-north-1'

      - name: Upload APKs to AWS S3 Bucket
        working-directory: ./mobile-app/build/app/outputs/flutter-apk
        run: |
          aws s3 cp app-arm64-v8a-release.apk s3://myvault-files-app/app-arm64-v8a-release.apk --acl public-read --content-type "application/vnd.android.package-archive"
          aws s3 cp app-armeabi-v7a-release.apk s3://myvault-files-app/app-armeabi-v7a-release.apk --acl public-read --content-type "application/vnd.android.package-archive"
          aws s3 cp app-x86_64-release.apk s3://myvault-files-app/app-x86_64-release.apk --acl public-read --content-type "application/vnd.android.package-archive"
          echo "✓ Successfully deployed split release APKs to AWS S3!"

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: myvault-release-apks
          path: ./mobile-app/build/app/outputs/flutter-apk/*.apk
