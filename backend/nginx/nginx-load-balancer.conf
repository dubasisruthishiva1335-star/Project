# MyVault Enterprise High-Availability Reverse Proxy & Load Balancer
upstream myvault_backend_cluster {
    least_conn; # Route to worker with fewest active connections
    server 127.0.0.1:3001 max_fails=3 fail_timeout=30s weight=3;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=30s weight=2;
    server 127.0.0.1:3003 max_fails=3 fail_timeout=30s backup;
    keepalive 64;
}

upstream myvault_admin_web {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=60r/s;

server {
    listen 80;
    server_name api.myvault.edu admin.myvault.edu;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # Backend API Cluster Route
    location /api/ {
        limit_req zone=api_rate_limit burst=30 nodelay;

        proxy_pass http://myvault_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # Admin Portal Frontend Route
    location / {
        proxy_pass http://myvault_admin_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
