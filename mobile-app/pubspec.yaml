name: myvault
description: MyVault — academics, results, internships and placements for engineering students.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  syncfusion_flutter_pdfviewer: ^28.2.3
  open_filex: ^4.5.0
  path_provider: ^2.1.3
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  http: ^1.2.2
  firebase_core: ^3.4.1
  firebase_messaging: ^15.1.1
  flutter_local_notifications: ^17.2.2
  file_picker: ^8.0.0
  image_picker: ^1.1.0
  flutter_animate: ^4.5.0
  shared_preferences: ^2.2.3
  fl_chart: ^0.68.0
  google_mlkit_text_recognition: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
